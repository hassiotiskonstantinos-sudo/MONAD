<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MONAD | Σύντομα Διαθέσιμο</title>
  <meta name="description" content="Η ελληνική έκδοση της ιστοσελίδας της MONAD βρίσκεται υπό κατασκευή. Επισκεφθείτε την αγγλική έκδοση.">
  <meta name="robots" content="noindex, nofollow">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #000;
      color: #fff;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .logo-wrap {
      margin-bottom: 3rem;
    }

    .logo-img {
      height: 5rem;
      width: auto;
      filter: brightness(0) invert(1);
    }

    .divider {
      width: 3rem;
      height: 3px;
      background: #f97316;
      margin: 2rem auto;
      border-radius: 2px;
    }

    .wip-icon {
      font-size: 3rem;
      margin-bottom: 1.5rem;
      opacity: 0.6;
    }

    .wip-label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #f97316;
      margin-bottom: 1rem;
    }

    .wip-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 700;
      line-height: 1.15;
      margin-bottom: 1.5rem;
    }

    .wip-subtitle {
      font-size: 1.1rem;
      color: rgba(255,255,255,0.6);
      max-width: 480px;
      line-height: 1.7;
      margin-bottom: 2.5rem;
    }

    .btn-en {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background-color: #f97316;
      color: #fff;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      padding: 0.9rem 2rem;
      border-radius: 2rem;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .btn-en:hover {
      background-color: #ea6a0a;
      transform: translateY(-1px);
    }

    .btn-en svg {
      width: 16px;
      height: 16px;
    }

    .footer-note {
      position: fixed;
      bottom: 2rem;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.25);
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <div class="logo-wrap">
    <a href="../index.html">
      <img src="../images/logo-monad.png" alt="MONAD" class="logo-img">
    </a>
  </div>

  <div class="wip-icon">⚒</div>
  <p class="wip-label">Υπό Κατασκευή</p>

  <h1 class="wip-title">
    Η ελληνική έκδοση<br>έρχεται σύντομα.
  </h1>

  <p class="wip-subtitle">
    Εργαζόμαστε για να σας προσφέρουμε μια πλήρη ελληνική εμπειρία. Εν τω μεταξύ, επισκεφθείτε την αγγλική έκδοση της ιστοσελίδας μας.
  </p>

  <a href="../index.html" class="btn-en">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    Αγγλική Έκδοση
  </a>

  <div class="divider" style="margin-top: 3rem;"></div>

  <p class="footer-note">&copy; 2024 MONAD Law Firm</p>

</body>
</html>
